[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wildfire-alert"
version = "0.1.0"
description = "Next-day wildfire spread prediction with discriminative per-location alerting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["h5py>=3.11", "matplotlib>=3.8", "rasterio>=1.3"]
convert = ["h5py>=3.11", "rasterio>=1.3", "tqdm>=4.67"]
ml = [
    "joblib>=1.5",
    "lightgbm>=4.5",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "segmentation-models-pytorch>=0.3.4",
    "shap>=0.52",
    "torch>=2.4",
    "torchvision>=0.19",
]
dev = [
    "black>=24.8",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wildfire_alert"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wildfire_alert"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
